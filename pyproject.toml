[project]
name = "appstore-screener"
version = "0.1.0"
description = "Crawler + scoring pipeline that finds stale mobile apps in live markets."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "anthropic>=0.40",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "respx>=0.21",
]
play = ["google-play-scraper>=1.2"]
ui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # tomlkit, not tomllib: writing settings back must preserve the comments in
    # config.toml, which explain every threshold.
    "tomlkit>=0.12",
]

[project.scripts]
screener = "screener.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screener"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = ["google_play_scraper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:screener.*"]
